function redimensionar(file, max = 1280) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)), cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url); res(cv.toDataURL('image/jpeg', 0.72)); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('imagen no válida')); };
    img.src = url;
  });
}

// convierte cualquier formato admitido en una lista de {finca, trabajos, fotos}
function leerImport(d, nombreArchivo) {

  };
  const anillo = r => { const pts = r.map(c => [+c[1], +c[0]]); if (pts.length > 1 && pts[0][0] === pts[pts.length - 1][0] && pts[0][1] === pts[pts.length - 1][1]) pts.pop(); return pts; };

/* =========================================================
   MANTENIMIENTO: cuándo toca volver a limpiar
   ========================================================= */
function estadoMant(f, ultimaTrab) {
  const m = f.mant || {}, ult = Math.max(ultimaTrab || 0, m.ultimaManual || 0), hoy = new Date();

  let venc = ult ? new Date(ult) : null; if (venc) venc.setMonth(venc.getMonth() + meses);
  if (m.incendios) {
    // franja de biomasa: limpia antes del 31 de mayo de cada campaña (vale lo hecho desde el 1 de octubre anterior)
    let D = new Date(hoy.getFullYear(), 4, 31, 23, 59); if (hoy > D) D = new Date(hoy.getFullYear() + 1, 4, 31, 23, 59);
    const ini = new Date(D.getFullYear() - 1, 9, 1);
    if (!(ult && ult >= ini.getTime())) venc = !venc || D < venc ? D : venc;
  }
  if (!ult && !m.incendios) return { st: 'nunca', txt: 'sin limpiezas registradas', col: '#9e9e9e' };
  const dias = Math.round((venc - hoy) / 864e5);
  if (dias < 0) return { st: 'venc', txt: `vencida hace ${-dias} días`, col: '#c62828', venc, dias };
  if (dias <= 30) return { st: 'pronto', txt: `toca en ${dias} días (${venc.toLocaleDateString('es-ES')})`, col: '#ef6c00', venc, dias };
  return { st: 'ok', txt: `al día hasta ${venc.toLocaleDateString('es-ES', { month: 'short', year: 'numeric' })}`, col: '#2e7d32', venc, dias };
}

   PENDIENTE: zonas fuertes a partir del mapa 3D y aviso al entrar

    const gy = !isNaN(zy1) && !isNaN(zy0) ? (zy1 - zy0) / (2 * c) : !isNaN(zy1) ? (zy1 - z[k]) / c : !isNaN(zy0) ? (z[k] - zy0) / c : 0;

}

  sheet(`<h3>⚠️ Peligro aquí</h3>
    <div class="incg">${Object.entries(PEL).map(([k, [e, t]]) => `<button class="btn big" data-p="${k}" style="margin:0;background:#c62828">${e}<br><small style="font-size:14px">${t}</small></button>`).join('')}</div>
    <div class="note" style="margin-top:8px">Se guarda en la posición del apero y queda en la finca: se esquiva en los planes y avisa por voz al acercarte. Se puede eliminar cuando quieras en ⋯ › ⚠️ Peligros.</div>`,
    sh => sh.querySelectorAll('[data-p]').forEach(b => b.onclick = () => registrarPeligro(b.dataset.p)));
}
function circuloLL(ll, r) { const P = Geo.projFor([ll]), c = P.fwd(ll[0], ll[1]), xy = []; for (let k = 0; k < 16; k++) { const a = k / 16 * 2 * Math.PI; xy.push([c[0] + r * Math.cos(a), c[1] + r * Math.sin(a)]); } return Geo.toLL(xy, P).map(q => [+q[0].toFixed(8), +q[1].toFixed(8)]); }
async function registrarPeligro(tipo) {
  const ll = work && work.last && work.last.cutLL ? work.last.cutLL : lastPos ? [lastPos.lat, lastPos.lon] : null;
  if (!ll) return toast('Sin posición GPS');
  const f = cur, r = PEL[tipo][2], p = { id: uid(), tipo, ll: [+ll[0].toFixed(7), +ll[1].toFixed(7)], radio: r, fecha: Date.now(), nota: '', trabId: work ? work.trab.id : null };
  f.exclusiones = f.exclusiones || []; const ex = { id: uid(), nombre: PEL[tipo][1], coords: circuloLL(p.ll, r), metodo: 'peligro', centro: p.ll, radio: r, fecha: Date.now() };
  f.exclusiones.push(ex); p.exclId = ex.id; f.peligros = [...(f.peligros || []), p];
  await saveCur(); closeSheet(); drawFinca();
  speak(PEL[tipo][1] + ' anotado', true); toast(`${PEL[tipo][0]} ${PEL[tipo][1]} guardado en la finca`);
}
function drawPeligros(f, layer) {
  (f.peligros || []).forEach(p => L.marker(p.ll, { zIndexOffset: 900, icon: L.divIcon({ className: '', html: `<div class="incpin" style="background:#ffebee;border:2px solid #c62828">${PEL[p.tipo][0]}</div>`, iconSize: [26, 26], iconAnchor: [13, 13] }) })
    .on('click', () => peligroOpts(f, p.id)).addTo(layer));
}
function peligroOpts(f, id) {
  const p = (f.peligros || []).find(x => x.id === id); if (!p) return;
  sheet(`<h3>${PEL[p.tipo][0]} ${PEL[p.tipo][1]}</h3><div class="note">${fFecha(p.fecha)}</div>
    <div class="srow"><span>Radio a esquivar (m)</span><input class="inp" id="pgR" inputmode="decimal" value="${String(p.radio).replace('.', ',')}" style="width:90px;text-align:right"></div>
    <label class="f">Nota</label><input class="inp" id="pgN" value="${esc(p.nota || '')}">
    <div class="row" style="margin-top:12px"><button class="btn err" id="pgD">Eliminar</button><button class="btn" id="pgS">Guardar</button></div>`,
    () => {
      $('pgS').onclick = async () => { const r = parseFloat($('pgR').value.replace(',', '.')); if (!(r > 0 && r < 30)) return toast('Radio no válido'); p.radio = r; p.nota = $('pgN').value.trim(); const ex = (f.exclusiones || []).find(e => e.id === p.exclId); if (ex) { ex.coords = circuloLL(p.ll, r); ex.radio = r; } await saveCur(); closeSheet(); drawFinca(); toast('Guardado' + (f.plan ? ' · recalcula el plan' : '')); };
      $('pgD').onclick = () => confirmSheet(`¿Eliminar ${PEL[p.tipo][1].toLowerCase()}?`, 'Eliminar', async () => { f.peligros = f.peligros.filter(x => x.id !== id); f.exclusiones = (f.exclusiones || []).filter(e => e.id !== p.exclId); await saveCur(); drawFinca(); toast('Eliminado' + (f.plan ? ' · recalcula el plan' : '')); }, true);
    });
}
function peligrosLista(f) {
  const L_ = (f.peligros || []).slice().sort((a, b) => b.fecha - a.fecha);
  sheet(`<h3>⚠️ Peligros · ${esc(f.nombre)}</h3>
    ${L_.length ? L_.map(p => `<button class="opt" data-id="${p.id}">${PEL[p.tipo][0]} ${PEL[p.tipo][1]}<small>${new Date(p.fecha).toLocaleDateString('es-ES')} · radio ${fmt(p.radio, 1)} m${p.nota ? ' · ' + esc(p.nota) : ''}</small></button>`).join('') : '<div class="note">Sin peligros. Se anotan durante el trabajo con el botón ⚠️.</div>'}
    <button class="btn sec" id="pgA" style="margin-top:8px">＋ Anotar aquí (posición GPS)</button>`,
    sh => { sh.querySelectorAll('[data-id]').forEach(b => b.onclick = () => { closeSheet(); const p = f.peligros.find(x => x.id === b.dataset.id); if (map) map.setView(p.ll, Math.max(map.getZoom(), 19)); peligroOpts(f, p.id); }); $('pgA').onclick = peligroSheet; });
}
function avisoPeligros(p) {
  if (!work || !cur || !(cur.peligros || []).length) return;
  if (work.tPel && p.t - work.tPel < 2000) return; work.tPel = p.t; work.pelDicho = work.pelDicho || {};
  const P = Geo.proj(p.lat, p.lon);
  for (const q of cur.peligros) {
    const a = P.fwd(q.ll[0], q.ll[1]), d = Math.hypot(a[0], a[1]) - q.radio;
    if (d < 12 && (!work.pelDicho[q.id] || p.t - work.pelDicho[q.id] > 60000)) { work.pelDicho[q.id] = p.t; speak(`Atención: ${PEL[q.tipo][1].toLowerCase()} a ${Math.max(1, Math.round(d))} metros`, true); toast(`${PEL[q.tipo][0]} ${PEL[q.tipo][1]} a ${Math.max(1, Math.round(d))} m`, 3000); break; }
  }
}

/* ---------- Panel de herramienta genérico ---------- */
function showTool(title, hint, btns) {
  $('tbMain').classList.add('hidden'); $('pRec').classList.add('hidden'); $('pTool').classList.remove('hidden');
  $('toolTitle').textContent = title; $('toolHint').innerHTML = hint;
  const host = $('toolBtns'); host.innerHTML = '';
  btns.forEach(([txt, cls, fn, dis]) => { const b = document.createElement('button'); b.className = 'btn ' + cls; b.textContent = txt; b.disabled = !!dis; b.onclick = fn; host.appendChild(b); });
}

$('tLinde').onclick = lindeMenu;
$('tExcl').onclick = exclMenu;
$('tEdit').onclick = editMenu;
$('tPlan').onclick = planMenu;
$('tWork').onclick = workMenu;
$('bLay').onclick = () => { if (!busy() || work) capasSheet(); };
$('tInfo').onclick = () => { if (!busy()) infoSheet(); };

(async () => {
  try {
    await DB.open();
    const s = await DB.kvGet('settings'); if (s) SB = { ...DEF, ...s };
    if (SB.mapaBase && !['OpenStreetMap', 'OpenTopoMap'].includes(SB.mapaBase)) SB.mapaBase = 'OpenStreetMap';
    if (SB.ferrado === 437) { SB.ferrado = 436; await DB.kvPut('settings', SB); }   // ferrado de Abegondo
    const c = await DB.kvGet('capas'); if (c) CFG = { ...CFG_DEF, ...c };
    await loadCat(); applyS(); await migrarVelocidad();
  } catch (e) { toast('Error de almacenamiento: ' + e.message, 5000); }
  $('syncSt').onclick = () => Sync.state === 'err' ? diagnostico() : cuentaSheet(); $('lGo').onclick = doLogin; $('lPass').onkeydown = e => { if (e.key === 'Enter') doLogin(); };
  $('lOff').onclick = async () => { SB.offline = true; await DB.raw.kvPut('settings', SB); await seedCat(); applyS(); showList(); };
  let ses = null;
  try { ses = await Remote.session(); } catch (e) { }
  if (ses) { Sync.user = ses.user; Sync.paint(); await showList(); comprobarActivo(); Sync.pull().then(() => { if (view === 'list' && !document.querySelector('.sheet')) showList(); }); }
  else if (!SB.offline && window.supabase) { loginView(); }
  else { await seedCat(); applyS(); await showList(); comprobarActivo(); }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').then(r => { r.update().catch(() => {}); }).catch(() => {});
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloaded || busy()) return; reloaded = true; location.reload(); });
  }
})();
window.LIMPFINC = { Geo, processTrack, DB, Planner, Sync, Remote, get CAT() { return CAT; }, get SB() { return SB; }, get map() { return map; }, get S() { return S; }, get cur() { return cur; } }; // para pruebas
